---
# Bazel CI configuration for prometheus/client_model
# This configuration is used by BazelCI to test the project

tasks:
  ubuntu2204:
    name: "Ubuntu 22.04"
    platform: ubuntu2204
    build_targets:
      - "//..."
    test_targets:
      - "//..."
    build_flags:
      - "--keep_going"
    test_flags:
      - "--keep_going"
      - "--test_output=errors"

  macos:
    name: "macOS"
    platform: macos
    build_targets:
      - "//..."
    test_targets:
      - "//..."
    build_flags:
      - "--keep_going"
    test_flags:
      - "--keep_going"
      - "--test_output=errors"

  windows:
    name: "Windows"
    platform: windows
    build_targets:
      - "//..."
    test_targets:
      - "//..."
    build_flags:
      - "--keep_going"
    test_flags:
      - "--keep_going"
      - "--test_output=errors"

# Bzlmod-specific testing
  ubuntu2204_bzlmod:
    name: "Ubuntu 22.04 (Bzlmod)"
    platform: ubuntu2204
    build_targets:
      - "//..."
    test_targets:
      - "//..."
    build_flags:
      - "--keep_going"
      - "--enable_bzlmod"
    test_flags:
      - "--keep_going"
      - "--test_output=errors"
      - "--enable_bzlmod"
